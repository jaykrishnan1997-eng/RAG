# This is a TOML document

[project]
name = "ram"
version = "0.1.0"
description = "RAM against the machine"
requires-python = ">3.10,<3.13"
dependencies = [
    "pydantic>=2.11.0",
    "fire",
    "regex",
    "transformers",
    "torch",
    "tqdm"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


[tool.uv.sources]
torch = { index = "pytorch-cpu"}

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
 
[dependency-groups]
dev = [
    "mypy",
    "flake8",
    "pytest",
]
