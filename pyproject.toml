# This is a TOML document

[project]
name = "RAM"
version = "0.1.0"
description = "RAM"
requires-python = ">3.12"
dependencies = [
    "pydantic>=2.11.0",
    "fire",
    "tiktoken",
    "sentence-transformers",
    "nltk"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "mypy",
    "flake8",
    "pytest",
]
